[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devtoolpack"
version = "0.2.0"
description = "CLI for DevOps tools installation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "rich>=13.7.0"
]

[project.scripts]
devpack = "devpack.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "responses>=0.25.0"
]

[tool.hatch.build]
include = [
    "/devpack",
    "/configs",
]

[tool.ruff]
line-length = 88
target-version = "py39"
